name: Update EPG

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  epg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Get iptv-org
        run: git clone --depth 1 https://github.com/iptv-org/epg.git /tmp/epg

      - name: Install dependencies
        run: cd /tmp/epg && npm install --production

      - name: Generate EPG
        shell: pwsh
        run: pwsh "$GITHUB_WORKSPACE/update-epg.ps1"

      - name: Save EPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add epg.xml
          git diff --cached --quiet || git commit -m "Update EPG"
          git push
